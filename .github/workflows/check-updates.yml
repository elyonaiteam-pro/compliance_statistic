name: Check procurement updates

on:
  schedule:
    # Every 3 hours. Adjust as needed — GitHub Actions free tier is generous
    # but not instant; don't go below ~15 min intervals.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @libsql/client cheerio web-push --no-save

      - name: Run check
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/check-updates.mjs
