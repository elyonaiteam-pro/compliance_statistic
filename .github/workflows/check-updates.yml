name: Check procurement updates

on:
  schedule:
    # Every 3 hours. Adjust as needed — GitHub Actions free tier is generous
    # but not instant; don't go below ~15 min intervals.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

# Never run two checks at once (cron + manual run would double-notify / double-hit ЕИС).
concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Locked versions from package-lock.json (the script uses cheerio, libsql, nodemailer).
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run check
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional: HTTP(S) proxy with a Russian exit IP (ЕИС blocks/throttles foreign IPs).
          EIS_PROXY_URL: ${{ secrets.EIS_PROXY_URL }}
        run: node scripts/check-updates.mjs
